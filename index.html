<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #1e3a8a 0%, #0b1728 70%);
            color: #e0f2ff;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            padding: 2rem 0;
        }

        .calculator-card {
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 55px rgba(15, 23, 42, 0.6);
            border: none;
            border-radius: 1rem;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(30, 64, 175, 0.95), rgba(12, 31, 54, 0.98));
        }

        .display-area {
            background: linear-gradient(160deg, rgba(12, 31, 54, 0.95), rgba(15, 76, 129, 0.85));
            padding: 1.5rem;
        }

        #display {
            background-color: rgba(191, 219, 254, 0.12);
            color: #dbeafe;
            border: none;
            border-radius: 0.75rem;
            font-size: 2rem;
            height: 70px;
            text-align: right;
            padding: 0.75rem 1rem;
        }

        #display:focus {
            box-shadow: none;
        }

        .history {
            max-height: 110px;
            overflow-y: auto;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .history li {
            background: rgba(148, 197, 253, 0.15);
            border-radius: 0.5rem;
            padding: 0.35rem 0.75rem;
            margin-bottom: 0.35rem;
        }

        .btn-calculator {
            border: none;
            border-radius: 0.75rem;
            color: #e0f2ff;
            font-weight: 600;
            padding: 0.95rem 0;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .btn-calculator:active {
            transform: scale(0.97);
        }

        .btn-operator {
            background: rgba(96, 165, 250, 0.28);
        }

        .btn-func {
            background: rgba(59, 130, 246, 0.25);
            color: #dbeafe;
        }

        .btn-command {
            background: rgba(129, 140, 248, 0.28);
            color: #e0e7ff;
        }

        .btn-equals {
            background-color: #3b82f6;
            color: #0b1728;
            font-weight: 700;
        }

        .btn-digit {
            background: rgba(191, 219, 254, 0.18);
        }

        .mode-toggle {
            background: rgba(96, 165, 250, 0.2);
            border-radius: 999px;
            font-size: 0.85rem;
            border: none;
            color: #e0f2ff;
            padding: 0.35rem 0.75rem;
        }

        .mode-toggle.active {
            background: rgba(191, 219, 254, 0.9);
            color: #0b1728;
            font-weight: 600;
        }

        @media (max-width: 576px) {
            .calculator-card {
                margin: 0 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card calculator-card bg-dark text-light">
            <div class="display-area">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="h5 mb-0">SciCalc Demo</h1>
                    <div>
                        <button id="degBtn" class="mode-toggle active" type="button">Deg</button>
                        <button id="radBtn" class="mode-toggle" type="button">Rad</button>
                    </div>
                </div>
                <input id="display" class="form-control" type="text" value="0" aria-label="Calculator display" readonly>
                <ul id="history" class="list-unstyled history mt-3 mb-0"></ul>
            </div>
            <div class="card-body p-4">
                <div class="row g-2">
                    <div class="col-3"><button class="btn btn-calculator btn-command w-100" data-command="clear">AC</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-command w-100" data-command="clear-entry">CE</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-command w-100" data-command="backspace" aria-label="Backspace"><i class="fa-solid fa-delete-left"></i></button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token="÷">÷</button></div>

                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="sin(">sin</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="cos(">cos</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="tan(">tan</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token="×">×</button></div>

                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="log(">log</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="ln(">ln</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="√("><i class="fa-solid fa-square-root-variable me-1"></i>√</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token="-">−</button></div>

                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="π">π</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="e">e</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="^">xʸ</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token="+">+</button></div>

                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="7">7</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="8">8</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="9">9</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token="%">%</button></div>

                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="4">4</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="5">5</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="6">6</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token="^2">x²</button></div>

                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="1">1</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="2">2</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="3">3</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="factorial">n!</button></div>

                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token="(">(</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token=")">)</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-digit w-100" data-token="0">0</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-operator w-100" data-token=".">.</button></div>

                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="Ans">Ans</button></div>
                    <div class="col-3"><button class="btn btn-calculator btn-func w-100" data-token="±">±</button></div>
                    <div class="col-6"><button class="btn btn-calculator btn-equals w-100" data-command="calculate">=</button></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const displayEl = document.getElementById('display');
        const historyEl = document.getElementById('history');
        const buttons = document.querySelectorAll('.btn-calculator');
        const degBtn = document.getElementById('degBtn');
        const radBtn = document.getElementById('radBtn');

        let expression = '';
        let lastResult = 0;
        let degreeMode = true; // true for degrees, false for radians

        const MAX_HISTORY = 6;

        const trig = (fn, value) => {
            const radians = degreeMode ? value * Math.PI / 180 : value;
            switch (fn) {
                case 'sin':
                    return Math.sin(radians);
                case 'cos':
                    return Math.cos(radians);
                case 'tan':
                    return Math.tan(radians);
                default:
                    return NaN;
            }
        };

        const factorial = (n) => {
            if (n < 0 || !Number.isFinite(n)) {
                return NaN;
            }
            if (Math.floor(n) !== n) {
                return gamma(n + 1);
            }
            let result = 1;
            for (let i = 2; i <= n; i += 1) {
                result *= i;
            }
            return result;
        };

        const gamma = (z) => {
            const g = 7;
            const p = [
                0.99999999999980993,
                676.5203681218851,
                -1259.1392167224028,
                771.32342877765313,
                -176.61502916214059,
                12.507343278686905,
                -0.13857109526572012,
                9.9843695780195716e-6,
                1.5056327351493116e-7
            ];

            if (z < 0.5) {
                return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
            }

            z -= 1;
            let x = p[0];
            for (let i = 1; i < g + 2; i += 1) {
                x += p[i] / (z + i);
            }
            const t = z + g + 0.5;
            return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
        };

        const updateDisplay = () => {
            displayEl.value = expression || '0';
        };

        const addToHistory = (expr, result) => {
            const item = document.createElement('li');
            item.innerHTML = `<strong>${expr}</strong> = ${result}`;
            historyEl.prepend(item);
            while (historyEl.childElementCount > MAX_HISTORY) {
                historyEl.removeChild(historyEl.lastChild);
            }
        };

        const clearEntry = () => {
            if (!expression) {
                return;
            }

            const functionPattern = /(sin|cos|tan|log|ln|√)\($/;
            const ansPattern = /Ans$/;

            if (functionPattern.test(expression)) {
                expression = expression.replace(functionPattern, '');
            } else if (ansPattern.test(expression)) {
                expression = expression.replace(ansPattern, '');
            } else if (/\^2$/.test(expression)) {
                expression = expression.slice(0, -2);
            } else if (/\^$/.test(expression)) {
                expression = expression.slice(0, -1);
            } else if (/[!%]$/.test(expression)) {
                expression = expression.slice(0, -1);
            } else if (/(\d+\.\d+|\d+)$/.test(expression)) {
                expression = expression.replace(/(\d+\.\d+|\d+)$/, '');
            } else {
                expression = expression.slice(0, -1);
            }

            updateDisplay();
        };

        const handleCommand = (command) => {
            switch (command) {
                case 'clear':
                    expression = '';
                    updateDisplay();
                    break;
                case 'clear-entry':
                    clearEntry();
                    break;
                case 'backspace':
                    expression = expression.slice(0, -1);
                    updateDisplay();
                    break;
                case 'calculate':
                    evaluateExpression();
                    break;
                default:
                    break;
            }
        };

        const appendToken = (token) => {
            switch (token) {
                case '±':
                    toggleSign();
                    return;
                case 'factorial':
                    if (expression && !expression.endsWith('(') && !expression.endsWith('^')) {
                        expression += '!';
                        updateDisplay();
                    }
                    return;
                case '^2':
                    if (expression) {
                        expression += '^2';
                        updateDisplay();
                    }
                    return;
                default:
                    expression += token;
                    updateDisplay();
            }
        };

        const toggleSign = () => {
            if (!expression) {
                expression = '-';
                updateDisplay();
                return;
            }

            const match = expression.match(/(-?\d+(?:\.\d+)?)$/);
            if (match) {
                const number = match[0];
                const startIndex = match.index || expression.length - number.length;
                const toggled = number.startsWith('-') ? number.slice(1) : `-${number}`;
                expression = expression.slice(0, startIndex) + toggled;
                updateDisplay();
            } else {
                expression = `-${expression}`;
                updateDisplay();
            }
        };

        const normalizeExpression = (expr) => {
            let normalized = expr;

            if (lastResult !== null) {
                normalized = normalized.replace(/Ans/g, `(${lastResult})`);
            }

            normalized = normalized.replace(/π/g, `(${Math.PI})`);
            normalized = normalized.replace(/e/g, `(${Math.E})`);
            normalized = normalized.replace(/√\(/g, 'Math.sqrt(');
            normalized = normalized.replace(/log\(/g, 'Math.log10(');
            normalized = normalized.replace(/ln\(/g, 'Math.log(');
            normalized = normalized.replace(/(sin|cos|tan)\(/g, (match) => {
                const fn = match.slice(0, -1);
                return `trig("${fn}",`;
            });
            normalized = normalized.replace(/\^/g, '**');
            normalized = normalized.replace(/÷/g, '/');
            normalized = normalized.replace(/×/g, '*');
            normalized = normalized.replace(/%/g, '/100');

            normalized = normalized.replace(/(\d+(?:\.\d+)?|\([^\)]+\))!/g, (match, group) => `factorial(${group})`);

            normalized = normalized.replace(/\^2/g, '**2');

            return normalized;
        };

        const evaluateExpression = () => {
            if (!expression) {
                return;
            }

            try {
                const normalized = normalizeExpression(expression);
                const result = Function('trig', 'factorial', `"use strict"; return (${normalized});`)(trig, factorial);

                if (!Number.isFinite(result)) {
                    throw new Error('Result is not finite');
                }

                addToHistory(expression, result);
                lastResult = result;
                expression = result.toString();
                updateDisplay();
            } catch (error) {
                displayEl.value = 'Error';
                setTimeout(() => {
                    expression = '';
                    updateDisplay();
                }, 1200);
            }
        };

        buttons.forEach((button) => {
            const command = button.dataset.command;
            const token = button.dataset.token;

            if (command) {
                button.addEventListener('click', () => handleCommand(command));
            } else if (token) {
                button.addEventListener('click', () => appendToken(token));
            }
        });

        const updateModeButtons = () => {
            if (degreeMode) {
                degBtn.classList.add('active');
                radBtn.classList.remove('active');
            } else {
                radBtn.classList.add('active');
                degBtn.classList.remove('active');
            }
        };

        degBtn.addEventListener('click', () => {
            degreeMode = true;
            updateModeButtons();
        });

        radBtn.addEventListener('click', () => {
            degreeMode = false;
            updateModeButtons();
        });

        updateDisplay();
    </script>
</body>
</html>
